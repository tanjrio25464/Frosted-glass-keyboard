
name: Build Frosted Glass Keyboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'FrostedGlassKeyboard-source.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "$SDKMANAGER" > sdkmanager-path.txt
          echo "Found SDK manager: $SDKMANAGER"

      - name: Install Android packages
        run: |
          SDKMANAGER=$(cat sdkmanager-path.txt)
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip FrostedGlassKeyboard-source.zip

      - name: Build APK
        run: gradle -p FrostedGlassKeyboard assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostedGlassKeyboard-APK
          path: FrostedGlassKeyboard/app/build/outputs/apk/debug/*.apk
