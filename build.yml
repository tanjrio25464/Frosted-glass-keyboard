
name: Build Frosted Glass Keyboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'FrostedGlassKeyboard-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip FrostedGlassKeyboard-source.zip

      - name: Build APK
        run: gradle -p FrostedGlassKeyboard assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostedGlassKeyboard-APK
          path: FrostedGlassKeyboard/app/build/outputs/apk/debug/*.apk
